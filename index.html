<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<title>AAMA, Media and Technology · Aadhi Media Agency</title>
<meta name="description" content="AAMA is a Sri Lankan media and technology company. Newsrooms, campaign intelligence and software in Sinhala, Tamil and English, including Paperly, the exam-practice app that marks every past paper." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500&family=Noto+Sans+Sinhala:wght@400;500&family=Noto+Serif+Tamil:wght@300;400&family=Noto+Serif+Sinhala:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --canvas: #F4F1EC;
    --canvas-soft: #FAF8F4;
    --canvas-deep: #0F0F0E;
    --surface-card: #FFFFFF;
    --surface-strong: #ECE7DE;
    --ink: #0F0F0E;
    --ink-soft: #2A2A28;
    --body: #4A4843;
    --muted: #6B675E;
    --muted-soft: #A8A39A;
    --hairline: #DCD7CC;
    --hairline-soft: #E8E3D8;
    --hairline-strong: #BFB8A9;
    --mint: #A4D2C5;
    --forest: #1A3A39;
    --on-dark: #FFFFFF;
    --on-dark-soft: #A8A39A;
    --on-dark-hairline: #2A2A28;

    --font-display: 'Fraunces', 'Times New Roman', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-tamil: 'Noto Sans Tamil', 'Inter', sans-serif;
    --font-sinhala: 'Noto Sans Sinhala', 'Inter', sans-serif;
    --font-tamil-display: 'Noto Serif Tamil', 'Fraunces', serif;
    --font-sinhala-display: 'Noto Serif Sinhala', 'Fraunces', serif;
  }

  [data-theme="dark"] {
    --canvas: #0F0F0E;
    --canvas-soft: #161614;
    --canvas-deep: #F4F1EC;
    --surface-card: #1A1A18;
    --surface-strong: #242420;
    --ink: #F4F1EC;
    --ink-soft: #DCD7CC;
    --body: #A8A39A;
    --muted: #807C73;
    --muted-soft: #4A4843;
    --hairline: #242420;
    --hairline-soft: #1A1A18;
    --hairline-strong: #38362F;
    --on-dark-hairline: #DCD7CC;
    --logo-filter: brightness(0) invert(1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: 0.16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 280ms ease, color 280ms ease;
  }

  /* === Type === */
  .display {
    font-family: var(--font-display);
    font-weight: 300;
    font-style: normal;
    letter-spacing: -0.02em;
    line-height: 1.04;
  }
  .display-mega { font-size: clamp(38px, 9vw, 104px); letter-spacing: -0.035em; line-height: 1.0; }
  .display-xl { font-size: clamp(32px, 6vw, 64px); letter-spacing: -0.025em; line-height: 1.05; }
  .display-lg { font-size: clamp(28px, 5vw, 48px); letter-spacing: -0.018em; line-height: 1.1; }
  .display-md { font-size: clamp(22px, 4vw, 32px); letter-spacing: -0.012em; line-height: 1.15; }

  .mono {
    font-family: var(--font-mono);
    font-feature-settings: "ss01", "ss02";
  }

  .body-md { font-size: 16px; line-height: 1.55; letter-spacing: 0.005em; color: var(--body); }
  .body-lg { font-size: 18px; line-height: 1.55; letter-spacing: 0; color: var(--body); }
  .body-sm { font-size: 14px; line-height: 1.55; color: var(--body); }

  /* Tamil & Sinhala adjustments */
  [lang="ta"] .display, [lang="ta"] .display-mega, [lang="ta"] .display-xl, [lang="ta"] .display-lg, [lang="ta"] .display-md {
    font-family: var(--font-tamil-display);
    letter-spacing: -0.005em;
    line-height: 1.18;
  }
  [lang="ta"] { font-family: var(--font-tamil); }
  [lang="si"] .display, [lang="si"] .display-mega, [lang="si"] .display-xl, [lang="si"] .display-lg, [lang="si"] .display-md {
    font-family: var(--font-sinhala-display);
    letter-spacing: -0.005em;
    line-height: 1.32;
  }
  [lang="si"] { font-family: var(--font-sinhala); }

  /* === Layout === */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
  }
  @media (max-width: 640px) {
    .container { padding: 0 16px; }
  }

  .section {
    padding-top: 96px;
    padding-bottom: 96px;
    position: relative;
  }
  .section-tight { padding-top: 64px; padding-bottom: 64px; }

  .hairline { background: var(--hairline); height: 1px; width: 100%; }
  .hairline-strong { background: var(--hairline-strong); height: 1px; width: 100%; }

  /* === Nav === */
  .nav {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 10px 14px 10px 22px;
    border-radius: 9999px;
    background: color-mix(in oklch, var(--canvas) 72%, transparent);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--hairline);
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 8px 32px -16px rgba(15,15,14,0.16);
    transition: all 280ms ease;
    width: calc(100% - 24px);
    max-width: 860px;
  }
  @media (max-width: 480px) {
    .nav { padding: 8px 10px 8px 16px; gap: 12px; top: 12px; }
    .wordmark { font-size: 17px; gap: 8px; }
    .wordmark-glyph { width: 18px; height: 18px; }
  }
  [data-theme="dark"] .nav {
    background: color-mix(in oklch, var(--canvas) 60%, transparent);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 32px -16px rgba(0,0,0,0.5);
  }

  .wordmark {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 19px;
    letter-spacing: -0.02em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .wordmark-glyph {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--mint), transparent 65%), var(--ink);
    flex-shrink: 0;
  }
  .nav-links {
    display: flex; align-items: center; gap: 22px;
    margin-left: auto; margin-right: 8px;
  }
  .nav-link {
    font-size: 14px; font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 160ms ease;
    cursor: pointer;
  }
  .nav-link:hover { color: var(--ink); }
  @media (max-width: 880px) { .nav-links { display: none; } }

  /* Mobile nav menu */
  .nav-menu-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border: 0;
    background: transparent;
    border-radius: 9999px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .nav-menu-btn:hover { background: var(--surface-strong); }
  .nav-menu-icon, .nav-menu-icon::before, .nav-menu-icon::after {
    content: '';
    display: block;
    width: 18px; height: 1.5px;
    background: var(--ink);
    position: relative;
    transition: transform 200ms ease, opacity 200ms ease;
  }
  .nav-menu-icon::before { position: absolute; top: -6px; left: 0; }
  .nav-menu-icon::after { position: absolute; top: 6px; left: 0; }
  @media (max-width: 880px) { .nav-menu-btn { display: flex; } }
  .nav-menu-drawer {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 18px 40px -24px rgba(15,15,14,0.24);
    transform-origin: top right;
    opacity: 0;
    transform: scale(0.96) translateY(-4px);
    pointer-events: none;
    transition: transform 200ms cubic-bezier(.2,.8,.2,1), opacity 160ms ease;
  }
  .nav-menu-drawer.is-open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  .nav-menu-link {
    padding: 12px 16px;
    min-height: 44px;
    display: flex;
    align-items: center;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    transition: background-color 160ms ease, color 160ms ease;
  }
  .nav-menu-link:hover { background: var(--surface-strong); color: var(--ink); }

  /* Lang toggle */
  .lang-toggle {
    display: flex;
    align-items: center;
    background: var(--surface-strong);
    border-radius: 9999px;
    padding: 3px;
    gap: 0;
    flex-shrink: 0;
  }
  .lang-btn {
    border: 0;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 6px 11px;
    border-radius: 9999px;
    color: var(--muted);
    cursor: pointer;
    transition: all 200ms ease;
    min-width: 38px;
  }
  .lang-btn[data-lang="ta"] { font-family: var(--font-tamil); font-weight: 500; font-size: 13px; letter-spacing: 0; }
  .lang-btn[data-lang="si"] { font-family: var(--font-sinhala); font-weight: 500; font-size: 13px; letter-spacing: 0; }
  .lang-btn.is-active {
    background: var(--ink);
    color: var(--canvas);
  }
  @media (max-width: 480px) {
    .lang-btn { padding: 6px 8px; min-width: 32px; font-size: 10px; }
    .lang-btn[data-lang="ta"], .lang-btn[data-lang="si"] { font-size: 11px; }
  }

  .theme-toggle-btn {
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    width: 36px; height: 36px;
    border-radius: 9999px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 160ms ease;
  }
  .theme-toggle-btn:hover { background: var(--surface-strong); }

  /* === Hero === */
  .hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    padding: 120px 0 80px;
    overflow: hidden;
  }
  @media (max-width: 480px) {
    .hero { padding: 100px 0 60px; }
    .hero-h1 { max-width: 100%; }
  }
  .hero-canvas {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }
  .hero-content { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .hero-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
    color: var(--muted);
  }
  .hero-h1 {
    margin: 0;
    max-width: 18ch;
  }
  .hero-h1 em {
    font-style: italic;
    font-weight: 300;
  }
  .hero-sub {
    max-width: 56ch;
    margin: 32px 0 0;
    font-size: 19px;
    line-height: 1.5;
    color: var(--body);
    letter-spacing: 0;
  }
  .hero-foot {
    position: absolute;
    bottom: 40px;
    left: 0; right: 0;
    z-index: 2;
  }
  .hero-foot-row {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 24px;
  }
  .hero-coords {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-align: right;
    margin-left: auto;
  }

  /* Engine */
  .section-head {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 64px;
    margin-bottom: 64px;
  }
  @media (max-width: 880px) {
    .section-head { grid-template-columns: 1fr; gap: 24px; }
  }
  .section-head-label { color: var(--muted); }
  .section-head h2 { margin: 0; }

  .pillars {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 880px) {
    .pillars { grid-template-columns: 1fr; }
  }
  .pillar-lead .pillar-viz { height: 160px; }
  .pillar-lead h3 { font-size: 30px; }
  @media (max-width: 880px) {
    .pillar-lead .pillar-viz { height: 120px; }
    .pillar-lead h3 { font-size: 26px; }
  }
  .pillar {
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 32px 28px;
    position: relative;
    overflow: hidden;
    transition: transform 320ms cubic-bezier(.2,.8,.2,1), border-color 320ms ease, box-shadow 320ms ease;
  }
  .pillar:hover {
    transform: translateY(-4px);
    border-color: var(--hairline-strong);
    box-shadow: 0 18px 40px -24px rgba(15,15,14,0.18);
  }
  .pillar-number {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 64px;
    display: flex;
    justify-content: space-between;
  }
  .pillar-viz {
    height: 120px;
    margin: 0 -28px 28px;
    border-bottom: 1px solid var(--hairline-soft);
    border-top: 1px solid var(--hairline-soft);
    background: var(--canvas-soft);
    position: relative;
    overflow: hidden;
  }
  .pillar h3 {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 26px;
    letter-spacing: -0.012em;
    line-height: 1.15;
    margin: 0 0 12px;
    max-width: 18ch;
  }
  .pillar p {
    font-size: 14.5px;
    color: var(--body);
    line-height: 1.55;
    margin: 0;
  }

  /* Bento */
  .bento {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    grid-template-rows: auto auto;
    gap: 16px;
  }
  @media (max-width: 880px) {
    .bento { grid-template-columns: 1fr; grid-template-rows: auto; }
  }
  .bento-tile {
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: 22px;
    padding: 32px;
    position: relative;
    overflow: hidden;
    transition: transform 380ms cubic-bezier(.2,.8,.2,1), border-color 380ms ease, box-shadow 380ms ease;
    min-height: 320px;
    display: flex;
    flex-direction: column;
  }
  .bento-tile:hover {
    transform: translateY(-3px);
    border-color: var(--forest);
    box-shadow: 0 24px 60px -32px rgba(15,15,14,0.22);
  }
  .bento-tile.large { grid-row: span 2; min-height: 520px; }
  .bento-tile-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
  }
  .bento-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--forest);
    background: color-mix(in oklch, var(--mint) 60%, transparent);
    padding: 6px 10px;
    border-radius: 9999px;
  }
  [data-theme="dark"] .bento-tag {
    background: color-mix(in oklch, var(--forest) 60%, transparent);
    color: var(--mint);
  }
  .bento-tile h3 {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 44px;
    letter-spacing: -0.022em;
    line-height: 1.04;
    margin: 20px 0 16px;
  }
  .bento-tile img { margin-bottom: 24px; align-self: flex-start; }
  @media (max-width: 640px) {
    .bento-tile img { margin-bottom: 16px; }
  }
  .bento-tile.large h3 { font-size: 56px; margin-top: 28px; }
  .bento-tile .bento-link { margin-top: auto; }
  .bento-tile p {
    color: var(--body);
    font-size: 15.5px;
    margin: 0 0 28px;
    max-width: 36ch;
  }
  .bento-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-decoration: none;
    text-transform: uppercase;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 4px;
    align-self: flex-start;
    transition: gap 240ms ease;
  }
  .bento-link:hover { gap: 14px; }
  .bento-link .arrow { display: inline-block; transition: transform 240ms ease; }
  .bento-link:hover .arrow { transform: translateX(2px); }
  .bento-link-soon {
    color: var(--muted);
    border-bottom-color: var(--hairline-strong);
    cursor: default;
  }

  .bento-viz {
    position: absolute;
    inset: auto 0 0 0;
    height: 32%;
    pointer-events: none;
    overflow: hidden;
    border-bottom-left-radius: 22px;
    border-bottom-right-radius: 22px;
    opacity: 0.4;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 50%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 50%, #000 100%);
  }
  .bento-tile.large .bento-viz { height: 38%; opacity: 0.55; }
  .bento-tile::after {
    content: '';
    position: absolute;
    inset: auto 0 0 0;
    height: 65%;
    background: linear-gradient(to bottom, var(--surface-card) 0%, color-mix(in oklch, var(--surface-card) 88%, transparent) 30%, color-mix(in oklch, var(--surface-card) 60%, transparent) 60%, transparent 100%);
    pointer-events: none;
    z-index: 0;
    border-bottom-left-radius: 22px;
    border-bottom-right-radius: 22px;
  }
  .bento-tile.large::after { height: 55%; }
  .bento-tile.soon::after { display: none; }
  .bento-tile > * { position: relative; z-index: 1; }
  .bento-tile > .bento-viz { z-index: 0; }

  /* Soon tile */
  .bento-tile.soon {
    background: var(--canvas-soft);
    border-style: dashed;
    border-color: var(--hairline-strong);
  }
  .bento-tile.soon:hover { transform: none; box-shadow: none; }
  .bento-tile.soon h3 { font-size: 22px; margin-top: 24px; color: var(--muted); }
  .bento-tile.soon { min-height: 252px; }

  /* Impact */
  .impact-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid var(--hairline);
  }
  @media (max-width: 880px) {
    .impact-stats { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 480px) {
    .impact-stats { grid-template-columns: 1fr; }
  }
  .impact-stat {
    padding: 32px 28px 0 0;
    border-left: 1px solid var(--hairline);
  }
  .impact-stat:first-child { border-left: 0; padding-left: 0; }
  @media (max-width: 880px) {
    .impact-stat:nth-child(2n+1) { border-left: 0; padding-left: 0; }
    .impact-stat:nth-child(-n+2) { padding-top: 0; }
  }
  @media (max-width: 480px) {
    .impact-stat { border-left: 0; padding: 28px 0 0; }
    .impact-stat:first-child { padding-top: 0; }
  }
  .impact-stat-value { margin: 0 0 12px; }
  .impact-stat-label {
    font-size: 14px;
    color: var(--body);
    line-height: 1.5;
    margin: 0;
    max-width: 26ch;
  }

  /* Process */
  .process-steps {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--hairline);
  }
  .process-step {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 32px;
    padding: 28px 0;
    border-bottom: 1px solid var(--hairline);
  }
  @media (max-width: 640px) {
    .process-step { grid-template-columns: 40px 1fr; gap: 16px; }
  }
  .process-step-n {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding-top: 4px;
  }
  .process-step-body h3 {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 22px;
    letter-spacing: -0.012em;
    margin: 0 0 8px;
  }
  .process-step-body p {
    font-size: 15px;
    color: var(--body);
    line-height: 1.55;
    margin: 0;
    max-width: 60ch;
  }

  /* FAQ */
  .faq-list {
    border-top: 1px solid var(--hairline);
  }
  .faq-item {
    padding: 28px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .faq-item h3 {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .faq-item p {
    font-size: 15px;
    color: var(--body);
    line-height: 1.55;
    margin: 0;
    max-width: 62ch;
  }

  /* Trust */
  .trust-strip {
    background: var(--surface-strong);
    border-radius: 18px;
    padding: 32px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px 32px;
  }
  .trust-line {
    font-size: 15px;
    color: var(--body);
    margin: 0;
    max-width: 32ch;
  }
  .trust-items {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  @media (max-width: 640px) {
    .trust-strip { padding: 24px; flex-direction: column; align-items: flex-start; }
  }

  /* Deploy / contact section */
  .deploy-section {
    background: var(--canvas-deep);
    color: var(--on-dark);
    padding: 96px 0 0;
    position: relative;
    overflow: hidden;
  }
  [data-theme="dark"] .deploy-section { background: #050505; }
  .deploy-panel {
    max-width: 640px;
    margin: 0 0 80px;
  }
  .deploy-sub {
    margin: 16px 0 32px;
    font-size: 17px;
    line-height: 1.5;
    color: var(--on-dark-soft);
    max-width: 48ch;
  }
  .deploy-form {
    display: flex;
    align-items: stretch;
    gap: 0;
    border: 1px solid var(--on-dark-hairline);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 200ms ease;
  }
  .deploy-form:focus-within { border-color: var(--mint); box-shadow: 0 0 0 4px color-mix(in oklch, var(--mint) 12%, transparent); }
  @media (max-width: 480px) {
    .deploy-form { flex-direction: column; border-radius: 12px; }
    .deploy-form button { padding: 14px; width: 100%; border-top: 1px solid var(--on-dark-hairline); }
  }
  .deploy-form input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--on-dark);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 16px 18px;
  }
  .deploy-form input::placeholder { color: rgba(255,255,255,0.35); }
  .deploy-form button {
    background: var(--mint);
    color: var(--forest);
    border: 0;
    padding: 0 28px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 180ms ease;
  }
  .deploy-form button:hover { background: #B8E0D4; }
  .deploy-form button:disabled { opacity: 0.5; cursor: default; }
  .deploy-status {
    margin-top: 16px;
    font-size: 14px;
    color: var(--on-dark-soft);
    min-height: 18px;
  }
  .deploy-status.success { color: var(--mint); }

  .footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 48px;
    padding: 64px 0;
    border-top: 1px solid var(--on-dark-hairline);
    color: var(--on-dark-soft);
  }
  @media (max-width: 720px) {
    .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  }
  .footer-col h4 {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--on-dark);
    margin: 0 0 18px;
  }
  .footer-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .footer-col a {
    color: var(--on-dark-soft);
    text-decoration: none;
    font-size: 14px;
    transition: color 160ms ease;
  }
  .footer-col a:hover { color: var(--on-dark); }
  .footer-soon { color: var(--muted-soft); font-size: 12px; }
  .footer-brand {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 38px;
    letter-spacing: -0.02em;
    color: var(--on-dark);
    line-height: 1;
    margin-bottom: 18px;
  }
  .footer-brand-sub {
    font-size: 14px;
    color: var(--on-dark-soft);
    max-width: 28ch;
    margin: 0;
  }
  .footer-bottom {
    border-top: 1px solid var(--on-dark-hairline);
    padding: 24px 0 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--on-dark-soft);
    flex-wrap: wrap;
    gap: 12px;
  }

  /* Reveal */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 800ms cubic-bezier(.2,.8,.2,1), transform 800ms cubic-bezier(.2,.8,.2,1);
  }
  .reveal.in { opacity: 1; transform: translateY(0); }
  .reveal-stagger > * {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 700ms cubic-bezier(.2,.8,.2,1), transform 700ms cubic-bezier(.2,.8,.2,1);
  }
  .reveal-stagger.in > *:nth-child(1) { transition-delay: 0ms; opacity: 1; transform: translateY(0); }
  .reveal-stagger.in > *:nth-child(2) { transition-delay: 80ms; opacity: 1; transform: translateY(0); }
  .reveal-stagger.in > *:nth-child(3) { transition-delay: 160ms; opacity: 1; transform: translateY(0); }
  .reveal-stagger.in > *:nth-child(4) { transition-delay: 240ms; opacity: 1; transform: translateY(0); }

  body.anim-off .reveal, body.anim-off .reveal-stagger > * {
    opacity: 1; transform: none; transition: none;
  }

  /* ===== Paperly brand tokens (from Paperly brand strategy) ===== */
  :root {
    --pp-paper: #FBF8F1;
    --pp-ink: #16213E;
    --pp-ink-soft: #3A4566;
    --pp-hl: #FFD43B;
    --pp-tick: #1E9E6A;
    --pp-margin: #E5674A;
    --pp-rule: #A9C6E8;
    --font-hand: 'Caveat', 'Comic Sans MS', cursive;
  }

  /* ===== Hero grid + CTAs ===== */
  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
    gap: 64px;
    align-items: center;
  }
  .hero-grid .hero-h1 { font-size: clamp(40px, 5.4vw, 80px); max-width: none; }
  [lang="ta"] .hero-grid .hero-h1, [lang="si"] .hero-grid .hero-h1 { font-size: clamp(32px, 3.8vw, 58px); }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 48px; padding: 0 22px;
    border-radius: 9999px;
    font-size: 15px; font-weight: 500;
    text-decoration: none;
    transition: transform 200ms ease, background-color 200ms ease, border-color 200ms ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--ink); color: var(--canvas); }
  .btn-ghost { color: var(--ink); border: 1px solid var(--hairline-strong); background: color-mix(in oklch, var(--canvas) 70%, transparent); }
  .btn-ghost:hover { border-color: var(--ink); }
  .hero-visual { display: flex; justify-content: flex-end; }
  @media (max-width: 960px) {
    .hero-grid { grid-template-columns: 1fr; gap: 48px; }
    .hero-visual { justify-content: flex-start; }
    .hero-foot { display: none; }
  }

  /* ===== Mark card ===== */
  .mark-card {
    margin: 0;
    width: 100%;
    max-width: 420px;
    background: var(--pp-paper);
    color: var(--pp-ink);
    border-radius: 20px;
    padding: 22px 22px 20px;
    border: 1px solid rgba(22,33,62,0.10);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 30px 60px -30px rgba(22,33,62,0.35), 0 8px 20px -12px rgba(22,33,62,0.18);
    transform: rotate(1.2deg);
    font-family: var(--font-body);
  }
  [data-theme="dark"] .mark-card { box-shadow: 0 30px 70px -30px rgba(0,0,0,0.8); }
  .mark-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mark-card-badge {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--pp-ink-soft);
    border: 1px solid rgba(22,33,62,0.18);
    padding: 4px 9px; border-radius: 9999px;
  }
  .mark-card-subject {
    margin-top: 18px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--pp-ink-soft);
  }
  .mark-card-q { margin: 6px 0 14px; font-size: 14.5px; line-height: 1.45; color: var(--pp-ink); }
  .mark-card-sheet {
    position: relative;
    height: 112px;
    padding: 4px 0 0 34px;
    border-left: 1.5px solid color-mix(in oklch, var(--pp-margin) 55%, transparent);
    margin-left: 6px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, color-mix(in oklch, var(--pp-rule) 70%, transparent) 35px, color-mix(in oklch, var(--pp-rule) 70%, transparent) 36px);
  }
  .hand {
    font-family: var(--font-hand);
    font-size: 25px; line-height: 36px; font-weight: 500;
    color: #26305A;
    white-space: nowrap;
  }
  .hl {
    background: linear-gradient(to top, color-mix(in oklch, var(--pp-hl) 85%, transparent) 0 55%, transparent 55%);
    padding: 0 4px;
  }
  .hand-margin {
    position: absolute; right: 64px; bottom: 6px;
    font-family: var(--font-hand); font-size: 22px; font-weight: 600;
    color: var(--pp-margin);
    transform: rotate(-6deg);
  }
  .mark-score {
    position: absolute; right: 4px; top: 8px;
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid var(--pp-margin);
    color: var(--pp-margin);
    font-family: var(--font-hand); font-size: 30px; font-weight: 600; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-10deg);
  }
  .mark-score span { font-size: 20px; }
  .mark-scheme { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px dashed rgba(22,33,62,0.2); }
  .mark-scheme-row {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center;
    padding: 9px 0;
    border-bottom: 1px dashed rgba(22,33,62,0.14);
    font-size: 13.5px;
    animation: markIn 500ms cubic-bezier(.2,.8,.2,1) both;
  }
  .mark-scheme-icon {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  .mark-scheme-row.ok .mark-scheme-icon { background: var(--pp-tick); }
  .mark-scheme-row.lost .mark-scheme-icon { background: var(--pp-margin); }
  .mark-scheme-row.lost .mark-scheme-label { color: var(--pp-ink); font-weight: 500; }
  .mark-scheme-marks { font-size: 12px; font-weight: 600; color: var(--pp-ink-soft); }
  .mark-scheme-row.lost .mark-scheme-marks { color: var(--pp-margin); }
  .mark-feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: color-mix(in oklch, var(--pp-hl) 28%, var(--pp-paper));
    border-left: 4px solid var(--pp-hl);
    font-size: 14px; line-height: 1.45; font-weight: 500;
    color: var(--pp-ink);
    animation: markIn 600ms cubic-bezier(.2,.8,.2,1) 2400ms both;
  }
  @keyframes markIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 480px) {
    .mark-card { transform: none; padding: 18px 16px; }
    .hand { font-size: 22px; }
    .hand-margin { right: 58px; }
  }

  /* Paperly wordmark: always Inter, whatever the page language */
  .pp-wordmark {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -0.045em;
    color: var(--pp-ink);
    line-height: 1;
  }
  .pp-dot { color: var(--pp-tick); }

  /* ===== Practices ===== */
  .section-head-label { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; padding-top: 14px; }
  .practices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 880px) { .practices { grid-template-columns: 1fr; } }
  .practice {
    display: flex; flex-direction: column;
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 28px;
    color: inherit; text-decoration: none;
    transition: transform 320ms cubic-bezier(.2,.8,.2,1), border-color 320ms ease, box-shadow 320ms ease;
  }
  .practice:hover { transform: translateY(-4px); border-color: var(--hairline-strong); box-shadow: 0 18px 40px -24px rgba(15,15,14,0.18); }
  .practice .pillar-number { margin-bottom: 40px; }
  .practice h3 { font-family: var(--font-display); font-weight: 300; font-size: 28px; letter-spacing: -0.014em; line-height: 1.12; margin: 0 0 12px; }
  .practice p { font-size: 15px; color: var(--body); margin: 0 0 20px; }
  .practice-links { list-style: none; padding: 0; margin: 0 0 28px; display: flex; flex-wrap: wrap; gap: 6px; }
  .practice-links li { font-size: 12.5px; color: var(--ink-soft); background: var(--surface-strong); padding: 5px 10px; border-radius: 9999px; }
  .practice-cta { margin-top: auto; }
  .practice-new { border-color: color-mix(in oklch, var(--pp-tick) 45%, var(--hairline)); background: linear-gradient(180deg, color-mix(in oklch, var(--pp-hl) 10%, var(--surface-card)), var(--surface-card) 55%); }
  .practice-new-tag {
    display: inline-block; margin-right: 8px;
    background: var(--pp-hl); color: var(--pp-ink);
    padding: 2px 7px; border-radius: 9999px; letter-spacing: 0.1em;
  }
  [lang="ta"] .practice h3, [lang="si"] .practice h3 { font-family: var(--font-body); font-weight: 500; font-size: 22px; line-height: 1.35; }

  /* ===== Paperly spotlight ===== */
  .pp {
    background: var(--pp-paper);
    color: var(--pp-ink);
    border-radius: 28px;
    padding: 48px;
    border: 1px solid rgba(22,33,62,0.08);
    position: relative;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
  }
  [lang="ta"] .pp { font-family: var(--font-tamil); }
  [lang="si"] .pp { font-family: var(--font-sinhala); }
  .pp::before {
    content: ''; position: absolute; inset: 0 auto 0 24px; width: 1.5px;
    background: color-mix(in oklch, var(--pp-margin) 35%, transparent);
    pointer-events: none;
  }
  .pp > * { position: relative; }
  .pp-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .pp-brand { display: flex; align-items: baseline; gap: 12px; }
  .pp-by { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pp-ink-soft); }
  .pp-status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--pp-ink);
    background: #fff; border: 1px solid rgba(22,33,62,0.12);
    padding: 7px 12px; border-radius: 9999px;
  }
  .pp-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pp-tick); box-shadow: 0 0 0 4px color-mix(in oklch, var(--pp-tick) 18%, transparent); }
  .pp-intro { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; margin-top: 56px; align-items: end; }
  .pp-h2 { margin: 0; font-size: clamp(40px, 6vw, 80px); font-weight: 700; letter-spacing: -0.045em; line-height: 0.98; }
  [lang="ta"] .pp-h2, [lang="si"] .pp-h2 { font-size: clamp(32px, 4.4vw, 56px); letter-spacing: -0.01em; line-height: 1.2; font-weight: 600; }
  .pp-sub { margin: 0; font-size: 18px; line-height: 1.55; color: var(--pp-ink-soft); }
  .pp-quote {
    margin: 48px 0 0; padding: 0;
    font-family: var(--font-hand); font-size: clamp(26px, 3.2vw, 38px); line-height: 1.25; font-weight: 500;
    color: var(--pp-ink);
  }
  [lang="ta"] .pp-quote, [lang="si"] .pp-quote { font-family: inherit; font-size: clamp(20px, 2.4vw, 26px); font-weight: 500; }
  .pp-quote mark { background: linear-gradient(to top, color-mix(in oklch, var(--pp-hl) 80%, transparent) 0 45%, transparent 45%); color: inherit; padding: 0 4px; }
  .pp-features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 48px; }
  .pp-feature { background: #fff; border: 1px solid rgba(22,33,62,0.08); border-radius: 16px; padding: 22px; }
  .pp-feature-icon {
    width: 34px; height: 34px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--pp-ink); color: var(--pp-paper); font-size: 16px; font-weight: 700;
  }
  .pp-feature:nth-child(2) .pp-feature-icon { background: var(--pp-tick); color: #fff; }
  .pp-feature h3 { margin: 18px 0 6px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .pp-feature p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--pp-ink-soft); }
  .pp-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--pp-ink-soft); }
  .pp-curricula { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-top: 32px; }
  .pp-curricula ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .pp-curricula li { font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: 9999px; border: 1px solid rgba(22,33,62,0.18); }
  .pp-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 48px; border-top: 1px solid rgba(22,33,62,0.14); }
  .pp-stat { padding: 24px 24px 0 0; }
  .pp-stat + .pp-stat { padding-left: 24px; border-left: 1px solid rgba(22,33,62,0.14); }
  .pp-stat-value { font-size: clamp(36px, 4.4vw, 56px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .pp-stat:first-child .pp-stat-value::after { content: '.'; color: var(--pp-tick); }
  .pp-stat p { margin: 10px 0 0; font-size: 14px; color: var(--pp-ink-soft); max-width: 30ch; }
  .pp-audiences { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; margin-top: 56px; }
  .pp-audience h3 { margin: 10px 0 6px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .pp-audience p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--pp-ink-soft); }
  .pp-cta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center;
    margin-top: 56px; padding: 32px;
    background: var(--pp-ink); color: var(--pp-paper);
    border-radius: 20px;
  }
  .pp-cta h3 { margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
  .pp-cta p { margin: 0; font-size: 15px; color: color-mix(in oklch, var(--pp-paper) 75%, transparent); }
  .pp-cta .pp-launch { margin-top: 14px; font-size: 13px; color: color-mix(in oklch, var(--pp-paper) 60%, transparent); max-width: 52ch; }
  .pp-form { display: flex; border: 1px solid color-mix(in oklch, var(--pp-paper) 25%, transparent); border-radius: 12px; overflow: hidden; }
  .pp-form:focus-within { border-color: var(--pp-hl); box-shadow: 0 0 0 4px color-mix(in oklch, var(--pp-hl) 18%, transparent); }
  .pp-form input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--pp-paper); font: inherit; font-size: 15px; padding: 15px 16px; }
  .pp-form input::placeholder { color: color-mix(in oklch, var(--pp-paper) 45%, transparent); }
  .pp-form button { background: var(--pp-hl); color: var(--pp-ink); border: 0; padding: 0 26px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .pp-form button:disabled { opacity: 0.6; cursor: default; }
  .pp-form-status { min-height: 20px; margin-top: 10px; font-size: 13.5px; color: color-mix(in oklch, var(--pp-paper) 75%, transparent); }
  .pp-form-status.success { color: #7FD8AE; }
  .pp-site { display: inline-block; margin-top: 4px; font-size: 12px; letter-spacing: 0.06em; color: var(--pp-paper); text-decoration: none; border-bottom: 1px solid color-mix(in oklch, var(--pp-paper) 40%, transparent); padding-bottom: 2px; }
  .pp a:focus-visible, .pp button:focus-visible { outline-color: var(--pp-hl); }
  @media (max-width: 1080px) {
    .pp-features { grid-template-columns: repeat(2, 1fr); }
    .pp-audiences { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 880px) {
    .pp { padding: 32px 24px; border-radius: 22px; }
    .pp::before { left: 12px; }
    .pp-intro { grid-template-columns: 1fr; gap: 20px; margin-top: 40px; }
    .pp-cta { grid-template-columns: 1fr; gap: 24px; padding: 24px; }
  }
  @media (max-width: 640px) {
    .pp { padding: 28px 18px; }
    .pp::before { display: none; }
    .pp-features, .pp-audiences { grid-template-columns: 1fr; }
    .pp-stats { grid-template-columns: 1fr; }
    .pp-stat, .pp-stat + .pp-stat { padding: 20px 0 0; border-left: 0; }
    .pp-form { flex-direction: column; }
    .pp-form button { padding: 14px; }
  }
  [data-theme="dark"] .pp { border-color: transparent; box-shadow: 0 40px 80px -40px rgba(0,0,0,0.8); }

  /* ===== Contact topics ===== */
  .deploy-topics { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 16px; }
  .deploy-topics-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-dark-soft); margin-right: 6px; }
  .deploy-topic {
    background: transparent; color: var(--on-dark);
    border: 1px solid var(--on-dark-hairline);
    border-radius: 9999px; padding: 8px 14px; min-height: 36px;
